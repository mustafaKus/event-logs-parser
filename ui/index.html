<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Event Parser</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes flash { 0%,100%{background:transparent} 25%{background:#e0e7ff} }
      .flash { animation: flash 0.6s ease-out; }
      @keyframes slideIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
      .slide-in { animation: slideIn 0.15s ease-out; }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      const { useEffect, useRef, useState } = React;

      /* ── helpers ──────────────────────────────────────────────────────────── */

      const api = async (path, opts = {}) => {
        const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return res.json();
      };

      const SOURCE = {
        llm:        { label: "LLM",        pill: "bg-indigo-100 text-indigo-700", border: "border-l-indigo-500" },
        parser:     { label: "Parser",     pill: "bg-emerald-100 text-emerald-700", border: "border-l-emerald-500" },
        quarantine: { label: "Quarantine", pill: "bg-rose-100 text-rose-700",    border: "border-l-rose-500" },
      };

      const PARSER_STATUS = {
        shadow: { badge: "bg-slate-200 text-slate-600", hint: "observing",  hintCls: "text-slate-400" },
        canary: { badge: "bg-amber-100 text-amber-700", hint: "learning",   hintCls: "text-amber-500" },
        active: { badge: "bg-emerald-200 text-emerald-700", hint: "validated", hintCls: "text-emerald-500" },
      };

      /* ── FeedEntry ────────────────────────────────────────────────────────── */

      function FeedEntry({ entry, displayN, isNew }) {
        const [patternOpen, setPatternOpen] = useState(false);
        const src = SOURCE[entry.source] || SOURCE.quarantine;
        const ps = entry.parser_status ? PARSER_STATUS[entry.parser_status] : null;
        const hasPattern = entry.pattern_type && entry.pattern_body;
        const fieldPairs = Object.entries(entry.fields || {});

        const patternHint = entry.source === "llm"
          ? { text: "new extraction", cls: "text-indigo-400" }
          : ps ? { text: ps.hint, cls: ps.hintCls } : null;

        return (
          <div className={`border-l-4 ${src.border} bg-white rounded-r shadow-sm mb-2 overflow-hidden${isNew ? " flash slide-in" : ""}`}>

            {/* Header */}
            <div className="flex items-center gap-2 px-3 pt-2 pb-1.5 border-b border-slate-100">
              <span className="mono text-slate-400 text-xs w-8 shrink-0 text-right select-none">{displayN}</span>
              <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold ${src.pill}`}>
                {src.label}
                {ps && (
                  <span className={`px-1 py-px rounded text-[10px] ${ps.badge}`}>{entry.parser_status}</span>
                )}
              </span>
              {entry.event_type && (
                <span className="font-bold text-sm text-slate-800">{entry.event_type}</span>
              )}
              {entry.source === "quarantine" && entry.reason && (
                <span className="text-xs text-rose-500 italic ml-1">{entry.reason}</span>
              )}
              {patternHint && entry.source === "llm" && (
                <span className={`text-xs ${patternHint.cls} ml-auto`}>← {patternHint.text}</span>
              )}
            </div>

            {/* Body */}
            <div className="px-3 py-2.5 space-y-2.5">

              {/* INPUT */}
              <div>
                <div className="text-[10px] font-semibold uppercase tracking-widest text-slate-400 mb-1 flex items-center gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-slate-300 inline-block"/>
                  Input
                </div>
                <div className="mono text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 break-all whitespace-pre-wrap leading-relaxed">
                  {entry.raw}
                </div>
              </div>

              {/* OUTPUT */}
              {fieldPairs.length > 0 && (
                <div>
                  <div className="text-[10px] font-semibold uppercase tracking-widest text-slate-400 mb-1 flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"/>
                    Output
                  </div>
                  <div className="bg-emerald-50 border border-emerald-200 rounded px-2.5 py-2">
                    <div className="flex flex-wrap gap-x-6 gap-y-1.5">
                      {fieldPairs.map(([k, v]) => (
                        <span key={k} className="mono text-xs inline-flex items-baseline gap-1">
                          <span className="text-emerald-600 font-medium">{k}</span>
                          <span className="text-slate-300">=</span>
                          <span className="text-slate-800 font-semibold">{v}</span>
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* PATTERN */}
              {hasPattern && (
                <div>
                  <button
                    onClick={() => setPatternOpen(o => !o)}
                    className="mono text-[11px] text-slate-400 hover:text-indigo-600 flex items-center gap-1.5 transition-colors"
                  >
                    <span className="text-[9px]">{patternOpen ? "▼" : "▶"}</span>
                    <span className="uppercase tracking-widest text-slate-500">{entry.pattern_type}</span>
                    <span className="text-slate-300">pattern</span>
                    {patternHint && (
                      <span className={`${patternHint.cls} font-medium`}>· {patternHint.text}</span>
                    )}
                  </button>
                  {patternOpen && (
                    <pre className="mono text-[11px] bg-slate-900 text-emerald-300 border border-slate-700 rounded px-3 py-2.5 whitespace-pre-wrap break-all max-h-48 overflow-auto mt-1 leading-relaxed">
                      {(() => {
                        try { return JSON.stringify(JSON.parse(entry.pattern_body), null, 2); }
                        catch { return entry.pattern_body; }
                      })()}
                    </pre>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ── StatsBar ─────────────────────────────────────────────────────────── */

      function StatsBar({ stats, busy, isDone }) {
        if (!stats) return null;
        const total = stats.total_lines ?? stats.total ?? 0;
        const llm = stats.from_llm ?? stats.llm ?? 0;
        const parser = stats.from_parser ?? stats.parser ?? 0;
        const quarantined = stats.quarantined ?? 0;
        const quarantinedFromParser = stats.quarantined_from_parser ?? 0;
        const quarantinedFromLLM = stats.quarantined_from_llm ?? quarantined;
        const pct = n => total > 0 ? ` (${Math.round(n / total * 100)}%)` : "";
        const quarantineShare = n => quarantined > 0 ? `${Math.round(n / quarantined * 100)}%` : "0%";

        return (
          <div className="bg-slate-800 border-b border-slate-700 px-4 py-1.5 flex items-center gap-5 text-xs flex-shrink-0">
            <span className="text-slate-400 font-medium">{total} lines</span>
            <span className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-emerald-400 inline-block"/>
              <span className="text-emerald-400 font-semibold">{parser}</span>
              <span className="text-slate-500">parser{pct(parser)}</span>
            </span>
            <span className="flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-indigo-400 inline-block"/>
              <span className="text-indigo-400 font-semibold">{llm}</span>
              <span className="text-slate-500">LLM{pct(llm)}</span>
            </span>
            {quarantined > 0 && (
              <span className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-rose-400 inline-block"/>
                <span className="text-rose-400 font-semibold">{quarantined}</span>
                <span className="text-slate-500">quarantined{pct(quarantined)} · LLM {quarantineShare(quarantinedFromLLM)} · q-parser {quarantineShare(quarantinedFromParser)}</span>
              </span>
            )}
            <span className="ml-auto text-xs">
              {busy && <span className="text-slate-400 animate-pulse">● processing…</span>}
              {isDone && !busy && <span className="text-slate-500">complete</span>}
            </span>
          </div>
        );
      }

      /* ── SummaryCard ──────────────────────────────────────────────────────── */
      // Big, on-purpose callout that shows the LLM% vs parser% for the most
      // recent run. After a TRAIN run it shows train metrics alone; after a
      // TEST run it shows test metrics with the train→test delta — the
      // demonstration of learning the user is asked to look at.

      function SummaryCard({ result }) {
        if (!result) return null;
        const { customer_id, train, test } = result;
        const compare = !!(train && test);
        const current = test || train;
        if (!current) return null;
        const fmtPct = n => `${(n * 100).toFixed(1)}%`;

        const curLLM = current.from_llm, curParser = current.from_parser;
        const curQuarantine = current.quarantined ?? 0;
        const curQuarantineParser = current.quarantined_from_parser ?? 0;
        const curQuarantineLLM = current.quarantined_from_llm ?? curQuarantine;
        const curLLMPct = current.total_lines ? curLLM / current.total_lines : 0;
        const curParserPct = current.total_lines ? curParser / current.total_lines : 0;
        const curQuarantinePct = current.total_lines ? curQuarantine / current.total_lines : 0;
        const curQuarantineParserShare = curQuarantine ? curQuarantineParser / curQuarantine : 0;
        const curQuarantineLLMShare = curQuarantine ? curQuarantineLLM / curQuarantine : 0;

        const trainLLMPct = compare && train.total_lines ? train.from_llm / train.total_lines : 0;
        const trainParserPct = compare && train.total_lines ? train.from_parser / train.total_lines : 0;
        const trainQuarantinePct = compare && train.total_lines ? (train.quarantined ?? 0) / train.total_lines : 0;
        const llmDelta = trainLLMPct - curLLMPct;
        const parserDelta = curParserPct - trainParserPct;
        const quarantineDelta = trainQuarantinePct - curQuarantinePct;

        const phaseTag = compare ? "test" : "train";
        const title = compare ? "Test Results" : "Train Results";
        const subtitle = compare
          ? `trained on ${train.total_lines} lines · tested on ${test.total_lines} lines`
          : `trained on ${train.total_lines} lines`;

        return (
          <div className="bg-white border border-indigo-300 rounded-lg shadow-sm px-3 py-2 mb-2">
            <div className="flex items-center justify-between gap-3 mb-1.5">
              <div className="flex items-baseline gap-2">
                <div className="text-[10px] uppercase tracking-widest text-indigo-600 font-semibold">{title}</div>
                <div className="mono text-xs text-slate-700">{customer_id}</div>
              </div>
              <div className="text-[10px] text-slate-400">{subtitle}</div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-1.5 mb-1.5">
              <div className="bg-emerald-50 border border-emerald-200 rounded px-2 py-1.5 flex items-baseline gap-2">
                <div className="text-lg font-bold text-emerald-700 mono leading-none">{fmtPct(curParserPct)}</div>
                <div className="flex-1 min-w-0">
                  <div className="text-[10px] uppercase tracking-wider text-emerald-700 font-semibold leading-tight">Parser ({phaseTag})</div>
                  <div className="text-[10px] mono text-emerald-800 leading-tight">{curParser}/{current.total_lines}{compare && (
                    <span className={`ml-1 ${parserDelta >= 0 ? "text-emerald-600" : "text-rose-500"}`}>
                      {parserDelta >= 0 ? "+" : ""}{(parserDelta * 100).toFixed(1)}pts
                    </span>
                  )}</div>
                </div>
              </div>
              <div className="bg-indigo-50 border border-indigo-200 rounded px-2 py-1.5 flex items-baseline gap-2">
                <div className="text-lg font-bold text-indigo-700 mono leading-none">{fmtPct(curLLMPct)}</div>
                <div className="flex-1 min-w-0">
                  <div className="text-[10px] uppercase tracking-wider text-indigo-700 font-semibold leading-tight">LLM ({phaseTag})</div>
                  <div className="text-[10px] mono text-indigo-800 leading-tight">{curLLM}/{current.total_lines}{compare && (
                    <span className={`ml-1 ${llmDelta >= 0 ? "text-emerald-600" : "text-rose-500"}`}>
                      {llmDelta >= 0 ? "−" : "+"}{Math.abs(llmDelta * 100).toFixed(1)}pts
                    </span>
                  )}</div>
                </div>
              </div>
              <div className="bg-rose-50 border border-rose-200 rounded px-2 py-1.5 flex items-baseline gap-2">
                <div className="text-lg font-bold text-rose-700 mono leading-none">{fmtPct(curQuarantinePct)}</div>
                <div className="flex-1 min-w-0">
                  <div className="text-[10px] uppercase tracking-wider text-rose-700 font-semibold leading-tight">Quarantine ({phaseTag})</div>
                  <div className="text-[10px] mono text-rose-800 leading-tight">{curQuarantine}/{current.total_lines}{compare && (
                    <span className={`ml-1 ${quarantineDelta >= 0 ? "text-emerald-600" : "text-rose-500"}`}>
                      {quarantineDelta >= 0 ? "−" : "+"}{Math.abs(quarantineDelta * 100).toFixed(1)}pts
                    </span>
                  )}</div>
                </div>
              </div>
            </div>

            <div className="text-[10px] text-slate-500 leading-tight">
              {compare
                ? (curLLMPct < 0.05 && curParserPct > 0.5
                    ? "✓ Parsers minted during training are doing the work on the test split. Learning confirmed."
                    : curLLMPct > 0.5
                    ? "✗ The LLM is still doing most of the extraction. Parsers haven't been promoted yet."
                    : "Partial — some clusters were learned, others still hit the LLM.")
                : "Cold-start train pass — every new cluster hits the LLM and mints a parser. Run Test next."}
            </div>
          </div>
        );
      }

      function compactPattern(patternType, patternBody) {
        if (!patternBody) return "—";
        if (patternType === "jsonpath" || patternType === "kv") {
          try {
            const parsed = JSON.parse(patternBody);
            if (parsed.fields && typeof parsed.fields === "object") {
              return Object.entries(parsed.fields)
                .slice(0, 4)
                .map(([k, v]) => `${k}=${v}`)
                .join(" · ");
            }
            return JSON.stringify(parsed).slice(0, 140);
          } catch {
            return patternBody.slice(0, 140);
          }
        }
        return patternBody.slice(0, 140);
      }

      function LearningSummary({ stats, feed, parsers, customerId, phaseLabel, eventCatalog, onOpenHistory }) {
        if (!stats && (!feed || feed.length === 0) && (!parsers || parsers.length === 0)) return null;

        const [expanded, setExpanded] = useState(false);

        const statusCounts = (parsers || []).reduce((acc, parser) => {
          acc[parser.status] = (acc[parser.status] || 0) + 1;
          return acc;
        }, { shadow: 0, canary: 0, active: 0 });

        const eventMap = new Map();
        const newBucket = eventType => ({
          eventType,
          total: 0,
          parser: 0,
          llm: 0,
          quarantine: 0,
          latestPatternType: null,
          latestPatternBody: null,
        });
        (feed || []).forEach(entry => {
          // Quarantined lines have event_type === "unknown", but the LLM may
          // still have classified them — bucket those under the LLM's guess so
          // they show up on the right card.
          const key = (entry.event_type && entry.event_type !== "unknown")
            ? entry.event_type
            : (entry.llm_event_type || "unknown");
          const bucket = eventMap.get(key) || newBucket(key);
          bucket.total += 1;
          if (entry.source === "parser") bucket.parser += 1;
          else if (entry.source === "llm") bucket.llm += 1;
          else bucket.quarantine += 1;
          if (entry.pattern_type && entry.pattern_body) {
            bucket.latestPatternType = entry.pattern_type;
            bucket.latestPatternBody = entry.pattern_body;
          }
          eventMap.set(key, bucket);

          // Synthetic "quarantine" bucket: every quarantined line lands here
          // regardless of which canonical event the LLM thought it was. The
          // parser/LLM split tells us how the *quarantine decision* was made
          // — by a learned quarantine parser or by the LLM saying so.
          if (entry.source === "quarantine") {
            const qBucket = eventMap.get("quarantine") || newBucket("quarantine");
            qBucket.total += 1;
            if (entry.parser_id) qBucket.parser += 1;
            else qBucket.llm += 1;
            if (entry.pattern_type && entry.pattern_body) {
              qBucket.latestPatternType = entry.pattern_type;
              qBucket.latestPatternBody = entry.pattern_body;
            }
            eventMap.set("quarantine", qBucket);
          }
        });

        const parserByEvent = new Map();
        (parsers || []).forEach(parser => {
          const current = parserByEvent.get(parser.event_type);
          const rank = { active: 0, canary: 1, shadow: 2, retired: 3 };
          if (!current || rank[parser.status] < rank[current.status]) {
            parserByEvent.set(parser.event_type, parser);
          }
        });

        const baseEvents = (eventCatalog && eventCatalog.length ? eventCatalog : Array.from(new Set([
          ...Array.from(eventMap.keys()),
          ...Array.from(parserByEvent.keys()),
        ]))).filter(event => event && event !== "unknown");

        // Always include the synthetic Quarantine card. We render it last so
        // canonical events stay in their natural order.
        if (!baseEvents.includes("quarantine")) baseEvents.push("quarantine");

        const events = baseEvents.map(eventType => eventMap.get(eventType) || newBucket(eventType));

        const historyByEvent = new Map();
        const pushHistoryRow = (key, entry, idx) => {
          if (!key || key === "unknown") return;
          const rows = historyByEvent.get(key) || [];
          // Distinguish quarantined attempts from successful ones in the dedupe
          // marker — the same pattern body can show up both as a successful
          // extraction and as a rejected proposal, and we want to see both.
          const marker = `${entry.source}:${entry.pattern_type}:${entry.pattern_body}`;
          if (rows.some(row => row.marker === marker)) return;
          rows.push({
            marker,
            patternType: entry.pattern_type,
            patternBody: entry.pattern_body,
            source: entry.source,
            reason: entry.reason || "",
            step: idx + 1,
          });
          historyByEvent.set(key, rows);
        };
        (feed || []).forEach((entry, idx) => {
          if (!entry.pattern_type || !entry.pattern_body) return;
          // 1. Canonical-event card: bucket under the LLM's intended event so
          //    quarantined attempts attach to the same card as successes.
          const canonicalKey = (entry.event_type && entry.event_type !== "unknown")
            ? entry.event_type
            : entry.llm_event_type;
          pushHistoryRow(canonicalKey, entry, idx);
          // 2. Quarantine card: collect every quarantine proposal here so the
          //    user sees the full set of shapes that failed canonical parsing.
          if (entry.source === "quarantine") {
            pushHistoryRow("quarantine", entry, idx);
          }
        });

        const totalParsers = (parsers || []).length;
        const totalLines = stats?.total_lines ?? stats?.total ?? feed.length ?? 0;

        return (
          <div className="bg-slate-100 px-3 pt-3 flex-shrink-0">
            <div className="bg-white border border-slate-200 rounded-xl shadow-sm p-3 space-y-3">
              <div className="flex items-center justify-between gap-3 flex-wrap">
                <div>
                  <div className="text-xs uppercase tracking-widest text-slate-500 font-semibold">Learning summary</div>
                  <div className="mono text-sm text-slate-700">{customerId}{phaseLabel ? ` · ${phaseLabel}` : ""}</div>
                </div>
                <div className="flex flex-wrap gap-2 text-xs items-center">
                  <span className="px-2.5 py-1 rounded bg-slate-100 text-slate-600">{totalLines} lines</span>
                  <span className="px-2.5 py-1 rounded bg-emerald-50 text-emerald-700">{statusCounts.active || 0} active</span>
                  <span className="px-2.5 py-1 rounded bg-amber-50 text-amber-700">{statusCounts.canary || 0} canary</span>
                  <span className="px-2.5 py-1 rounded bg-slate-100 text-slate-700">{statusCounts.shadow || 0} shadow</span>
                  <span className="px-2.5 py-1 rounded bg-indigo-50 text-indigo-700">{totalParsers} learned parsers</span>
                  <button
                    onClick={() => setExpanded(v => !v)}
                    className="px-2.5 py-1 rounded border border-slate-200 hover:bg-slate-50 text-slate-600"
                  >
                    {expanded ? "Hide details" : "Show details"}
                  </button>
                </div>
              </div>

              <div className="border border-slate-200 rounded-lg p-2 bg-slate-50">
                <div className="text-[11px] uppercase tracking-widest text-slate-500 font-semibold mb-2">Event cards</div>
                <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1 snap-x">
                  {events.map(event => {
                    const parserPct = event.total ? Math.round((event.parser / event.total) * 100) : 0;
                    const llmPct = event.total ? Math.round((event.llm / event.total) * 100) : 0;
                    const learned = parserByEvent.get(event.eventType);
                    const history = historyByEvent.get(event.eventType) || [];
                    const isQtn = event.eventType === "quarantine";
                    const cardCls = isQtn
                      ? "bg-rose-50/40 border-rose-200 hover:border-rose-300 hover:bg-rose-50/70"
                      : "bg-white border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/20";
                    return (
                      <button
                        key={event.eventType}
                        type="button"
                        onClick={() => {
                          onOpenHistory?.({
                            eventType: event.eventType,
                            history,
                            parser: learned || null,
                          });
                        }}
                        className={`border rounded-lg p-2.5 text-left transition-colors shrink-0 w-56 snap-start ${cardCls}`}
                      >
                        <div className="flex items-center justify-between gap-2 mb-1.5">
                          <div className={`font-semibold text-sm ${isQtn ? "text-rose-700" : "text-slate-800"}`}>{event.eventType}</div>
                          <span className={`text-[10px] px-2 py-0.5 rounded ${learned ? (PARSER_STATUS[learned.status]?.badge || "bg-slate-100 text-slate-600") : "bg-slate-100 text-slate-500"}`}>
                            {learned ? learned.status : "idle"}
                          </span>
                        </div>
                        {isQtn ? (
                          <div className="grid grid-cols-3 gap-1 text-[11px] mb-2">
                            <div><span className="text-slate-400">seen</span><div className="mono text-rose-700 font-semibold">{event.total}</div></div>
                            <div><span className="text-slate-400">parser</span><div className="mono text-emerald-700 font-semibold">{event.parser} <span className="text-slate-400">{parserPct}%</span></div></div>
                            <div><span className="text-slate-400">LLM</span><div className="mono text-indigo-700 font-semibold">{event.llm} <span className="text-slate-400">{llmPct}%</span></div></div>
                          </div>
                        ) : (
                          <div className="grid grid-cols-4 gap-1 text-[11px] mb-2">
                            <div><span className="text-slate-400">seen</span><div className="mono text-slate-700 font-semibold">{event.total}</div></div>
                            <div><span className="text-slate-400">parser</span><div className="mono text-emerald-700 font-semibold">{event.parser} <span className="text-slate-400">{parserPct}%</span></div></div>
                            <div><span className="text-slate-400">LLM</span><div className="mono text-indigo-700 font-semibold">{event.llm} <span className="text-slate-400">{llmPct}%</span></div></div>
                            <div><span className="text-slate-400">qtn</span><div className={`mono font-semibold ${event.quarantine ? "text-rose-700" : "text-slate-400"}`}>{event.quarantine}</div></div>
                          </div>
                        )}
                        <div className="mono text-[10px] text-slate-600 bg-slate-50 border border-slate-200 rounded px-2 py-1 min-h-[40px] break-all whitespace-pre-wrap">
                          {learned ? compactPattern(learned.pattern_type, learned.pattern_body) : (event.latestPatternBody ? compactPattern(event.latestPatternType, event.latestPatternBody) : "No parser yet")}
                        </div>
                        <div className="text-[10px] text-slate-400 mt-1.5">click to inspect · history {history.length}</div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {expanded && (
                <div className="grid grid-cols-1 gap-3">
                  <div className="border border-slate-200 rounded-lg p-3 bg-slate-50">
                    <div className="text-[11px] uppercase tracking-widest text-slate-500 font-semibold mb-3">Parser lifecycle</div>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        ["Active", statusCounts.active || 0, "text-emerald-700"],
                        ["Canary", statusCounts.canary || 0, "text-amber-700"],
                        ["Shadow", statusCounts.shadow || 0, "text-slate-700"],
                        ["Total", totalParsers, "text-indigo-700"],
                      ].map(([label, value, textTone]) => (
                        <div key={label} className="bg-white border border-slate-200 rounded px-3 py-2">
                          <div className="text-[10px] uppercase tracking-widest text-slate-400 mb-1">{label}</div>
                          <div className={`text-2xl font-bold mono ${textTone}`}>{value}</div>
                        </div>

                    </div>
                  </div>
                </div>

      }

      function ExpressionHistoryModal({ open, onClose, details }) {
        useEffect(() => {
          if (!open) return;
          const onKey = e => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [open, onClose]);

        if (!open || !details) return null;
        const history = details.history || [];
        const parser = details.parser;

        return (
          <div className="fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-6" onClick={onClose}>
            <div className="bg-white border border-slate-200 rounded-xl shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
              <div className="flex items-center justify-between px-4 py-3 border-b border-slate-200">
                <div>
                  <div className="text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Expression history</div>
                  <div className="font-semibold text-slate-800">{details.eventType}</div>
                </div>
                <div className="flex items-center gap-2">
                  {parser && <span className={`text-[10px] px-2 py-0.5 rounded ${PARSER_STATUS[parser.status]?.badge || "bg-slate-100 text-slate-600"}`}>{parser.status}</span>}
                  <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-sm" title="Close (Esc)">✕</button>
                </div>
              </div>
              <div className="p-4 overflow-auto space-y-2">

                  <div className="text-sm text-slate-400">No learned-expression attempts yet.</div>
                ) : history.map(item => {
                  const isQuarantine = item.source === "quarantine";
                  const tone = isQuarantine

                    : "border-slate-200 bg-slate-50";
                  const sourceTone = isQuarantine ? "text-rose-600 font-semibold" : "text-slate-400";

                        <span className={`uppercase ${sourceTone}`}>{item.source}</span>
                        <span className="mono">{item.patternType}</span>

      /* ── DatasetCard ──────────────────────────────────────────────────────── */
      // One card per (family, variant). Shows the first line of each split as
      // a peek, with a click-to-expand accordion that reveals up to 10 lines.

      // Small chip showing a one-line teaser; click to open a full modal.
      function PreviewChip({ tone, label, lines, onOpen }) {
        const head = (lines && lines[0]) || "";
        const colors = {
          train: { head: "text-amber-600",   bg: "bg-amber-50",   border: "border-amber-200"   },
          test:  { head: "text-emerald-600", bg: "bg-emerald-50", border: "border-emerald-200" },
        }[tone];
        return (
          <button
            onClick={onOpen}
            className={`w-full text-left rounded px-1.5 py-1 border mb-1.5 ${colors.bg} ${colors.border} hover:brightness-95 transition`}
          >
            <div className={`text-[9px] uppercase tracking-widest font-semibold mb-0.5 flex items-center justify-between ${colors.head}`}>
              <span>{label}</span>
              <span className="normal-case tracking-normal text-[10px] text-slate-400">
                click · {lines?.length || 0} lines
              </span>
            </div>
            <div className="mono text-[10px] text-slate-700 truncate leading-tight" title={head}>{head}</div>
          </button>
        );
      }

      // Full-screen modal showing the entire log file. Fetches /sample/<name>
      // on open so the user can scroll the whole train or test split (not just
      // the chip teaser). ESC or backdrop click closes.
      function SamplesModal({ open, onClose, title, tone, sampleName, totalLines }) {
        const [content, setContent] = useState(null);   // string | null
        const [loading, setLoading] = useState(false);
        const [err, setErr] = useState(null);

        useEffect(() => {
          if (!open || !sampleName) return;
          let cancelled = false;
          setContent(null); setErr(null); setLoading(true);
          api(`/sample/${sampleName}`)
            .then(data => { if (!cancelled) setContent(data.content || ""); })
            .catch(e => { if (!cancelled) setErr(e.message); })
            .finally(() => { if (!cancelled) setLoading(false); });
          return () => { cancelled = true; };
        }, [open, sampleName]);

        useEffect(() => {
          if (!open) return;
          const onKey = e => { if (e.key === "Escape") onClose(); };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [open, onClose]);

        if (!open) return null;
        const headColor = tone === "train" ? "text-amber-300" : "text-emerald-300";
        const lines = content == null ? null : content.split("\n").filter(l => l.length > 0);
        return (
          <div
            className="fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-6"
            onClick={onClose}
          >
            <div
              className="bg-slate-900 border border-slate-700 rounded-lg shadow-2xl max-w-5xl w-full max-h-[85vh] flex flex-col"
              onClick={e => e.stopPropagation()}
            >
              <div className="flex items-center justify-between px-4 py-2.5 border-b border-slate-700">
                <div>
                  <span className={`text-[10px] uppercase tracking-widest font-semibold ${headColor}`}>{tone}</span>
                  <span className="ml-2 mono text-sm text-slate-200">{title}</span>
                  <span className="ml-2 text-xs text-slate-400">
                    · {lines == null ? `${totalLines || "?"} lines` : `${lines.length} lines`}
                  </span>
                </div>
                <button
                  onClick={onClose}
                  className="text-slate-400 hover:text-slate-200 text-sm"
                  title="Close (Esc)"
                >✕</button>
              </div>
              <div className="overflow-auto p-3 flex-1">
                {loading && (
                  <div className="text-slate-400 text-xs animate-pulse">loading {totalLines || "?"} lines…</div>
                )}
                {err && (
                  <div className="text-rose-400 text-xs mono">error: {err}</div>
                )}
                {!loading && !err && lines && (
                  <div className="mono text-xs text-slate-100 space-y-0.5 leading-relaxed">
                    {lines.map((l, i) => (
                      <div key={i} className="flex gap-3">
                        <span className="text-slate-500 select-none w-12 text-right shrink-0">{i + 1}</span>
                        <span className="whitespace-pre-wrap break-all">{l}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div className="px-4 py-2 border-t border-slate-700 text-[11px] text-slate-500 flex justify-between">
                <span>Press Esc or click outside to close</span>
                <span className="mono">full file</span>
              </div>
            </div>
          </div>
        );
      }

      function DatasetCard({ ds, isActive, hasTrain, busy, onTrain, onTest, onOpenPreview }) {
        // Default-collapsed so all 8 cards fit in a single compact row. Click
        // the header to expand and see the train/test preview + run buttons.
        // Active (most recently used) cards auto-expand for visibility.
        const [open, setOpen] = useState(false);
        useEffect(() => { if (isActive) setOpen(true); }, [isActive]);

        return (
          <div className={`border rounded text-xs transition-colors ${
            isActive ? "border-indigo-400 bg-indigo-50" : "border-slate-200 bg-white"
          }`}>
            <button
              onClick={() => setOpen(o => !o)}
              className="w-full flex items-center gap-2 px-2.5 py-2 hover:bg-slate-50/60 transition-colors text-left"
            >
              <span className="text-[10px] text-slate-400 select-none w-3">{open ? "▼" : "▶"}</span>
              <span className="font-semibold text-slate-800 mono">{ds.customer_id}</span>
              <span className="text-[10px] text-slate-400 uppercase">{ds.family} v{ds.variant}</span>
              <span className="ml-auto text-[10px] text-slate-400 mono">
                {ds.train.line_count}/{ds.test.line_count}L
              </span>
              {hasTrain && <span className="text-[10px] text-emerald-600">✓</span>}
            </button>

            {open && (
              <div className="px-2.5 pb-2.5 pt-0.5 border-t border-slate-200/60">
                <div className="text-[11px] text-slate-500 mb-1.5 mono">
                  train {ds.train.line_count}L · test {ds.test.line_count}L
                </div>
                <PreviewChip tone="train" label="train sample" lines={ds.train.preview}
                  onOpen={() => onOpenPreview("train", ds)} />
                <PreviewChip tone="test"  label="test sample"  lines={ds.test.preview}
                  onOpen={() => onOpenPreview("test",  ds)} />
                <div className="flex gap-1.5 mt-2">
                  <button
                    onClick={onTrain}
                    disabled={busy}
                    title="Cold start: clears this customer's parser library, then trains."
                    className="flex-1 bg-amber-500 hover:bg-amber-600 text-white text-[11px] font-semibold rounded px-2 py-1 disabled:opacity-50 transition-colors"
                  >
                    Run Train
                  </button>
                  <button
                    onClick={onTest}
                    disabled={busy || !hasTrain}
                    title={hasTrain ? "Run test split using the just-trained parsers" : "Run train first"}
                    className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold rounded px-2 py-1 disabled:opacity-30 transition-colors"
                  >
                    Run Test
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      /* ── App ──────────────────────────────────────────────────────────────── */

      function App() {
        const [samples, setSamples] = useState([]);
        const [datasets, setDatasets] = useState([]);
        const [selected, setSelected] = useState(null);  // legacy single-sample name
        const [activeDataset, setActiveDataset] = useState(null);  // {family, variant, customer_id, train, test}
        const [customerId, setCustomerId] = useState("acme");
        const [mode, setMode] = useState("dataset");  // "dataset" | "single"
        const [singleLine, setSingleLine] = useState("");

        const [feed, setFeed] = useState([]);
        const [newestKey, setNewestKey] = useState(null);
        const [runStats, setRunStats] = useState(null);
        const [liveStats, setLiveStats] = useState(null);
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState(null);
        const [phaseLabel, setPhaseLabel] = useState(null);  // "train" | "test" | null
        const [summary, setSummary] = useState(null);  // {customer_id, train, test|null} — train|test summary card
        const [trainStatsByCust, setTrainStatsByCust] = useState({});  // last train run keyed by customer_id
        const [parserSnapshot, setParserSnapshot] = useState([]);
        const [eventCatalog, setEventCatalog] = useState([]);
        const [previewModal, setPreviewModal] = useState(null);
        const [historyModal, setHistoryModal] = useState(null);

        const feedRef = useRef(null);
        const shouldFollow = useRef(true);
        const keyCounter = useRef(0);

        useEffect(() => {
          const el = feedRef.current;
          if (!el || !shouldFollow.current) return;
          el.scrollTop = el.scrollHeight;
        }, [feed]);

        const handleScroll = () => {
          const el = feedRef.current;
          if (!el) return;
          shouldFollow.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
        };

        useEffect(() => {
          api("/health").then(data => setEventCatalog(data.events || [])).catch(() => setEventCatalog([]));
          api("/samples").then(setSamples).catch(e => setError(e.message));
          api("/datasets").then(d => {
            setDatasets(d);
            if (d.length) {
              setActiveDataset(d[0]);
              setCustomerId(d[0].customer_id);
            }
          }).catch(e => setError(e.message));
        }, []);

        useEffect(() => {
          if (!customerId) return;
          api(`/parsers/${customerId}`).then(setParserSnapshot).catch(() => setParserSnapshot([]));
        }, [customerId]);

        const switchMode = newMode => {
          if (newMode === mode) return;
          setMode(newMode);
          setFeed([]);
          setRunStats(null);
          setLiveStats(null);
          setSummary(null);
          setPhaseLabel(null);
        };

        const clearAll = () => {
          setFeed([]); setRunStats(null); setLiveStats(null);
          setSummary(null); setPhaseLabel(null);
        };

        const refreshParserSnapshot = async (customer) => {
          try {
            const rows = await api(`/parsers/${customer}`);
            setParserSnapshot(rows);
          } catch {
            setParserSnapshot([]);
          }
        };

        /* core streaming — body is merged with customer_id. Returns the final
         * "done" stats event (or null if nothing came back). */
        const doStream = async (body, resetFeed, opts = {}) => {
          const { customer = customerId, phase = null } = opts;
          setBusy(true);
          setError(null);
          if (resetFeed) {
            setFeed([]);
            setRunStats(null);
            setLiveStats({ total: 0, llm: 0, parser: 0, quarantined: 0, quarantined_from_parser: 0, quarantined_from_llm: 0 });
            setParserSnapshot([]);
          }
          if (phase) setPhaseLabel(phase);
          shouldFollow.current = true;

          let doneEvt = null;
          try {
            const res = await fetch("/process/stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ customer_id: customer, ...body }),
            });
            if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);

            const reader = res.body.getReader();
            const dec = new TextDecoder();
            let buf = "";

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += dec.decode(value, { stream: true });
              const parts = buf.split("\n\n");
              buf = parts.pop();
              for (const part of parts) {
                if (!part.startsWith("data: ")) continue;
                let evt;
                try { evt = JSON.parse(part.slice(6)); } catch { continue; }

                if (evt.type === "done") {
                  doneEvt = evt;
                  if (resetFeed) setRunStats(evt);
                  await refreshParserSnapshot(customer);
                } else {
                  const key = ++keyCounter.current;
                  evt._key = key;
                  setNewestKey(key);
                  setFeed(prev => [...prev, evt]);
                  setLiveStats(prev => ({
                    total:      (prev?.total      ?? 0) + 1,
                    llm:        (prev?.llm        ?? 0) + (evt.source === "llm"        ? 1 : 0),
                    parser:     (prev?.parser     ?? 0) + (evt.source === "parser"     ? 1 : 0),
                    quarantined:(prev?.quarantined ?? 0) + (evt.source === "quarantine" ? 1 : 0),
                    quarantined_from_parser: (prev?.quarantined_from_parser ?? 0) + (evt.source === "quarantine" && evt.parser_id ? 1 : 0),
                    quarantined_from_llm: (prev?.quarantined_from_llm ?? 0) + (evt.source === "quarantine" && !evt.parser_id ? 1 : 0),
                  }));
                }
              }
            }
          } catch (e) {
            setError(e.message);
          } finally {
            setBusy(false);
          }
          return doneEvt;
        };

        /* Run TRAIN file for the active dataset. Resets the customer's parser
         * library *first* so each train pass is a true cold-start — otherwise
         * a second click would silently reuse parsers from the first pass and
         * the LLM call-rate would be 0% for what looked like a fresh training
         * run. Stashes the resulting stats so the subsequent test run can
         * compute deltas. */
        const runTrain = async (ds = activeDataset) => {
          if (busy || !ds) return;
          setActiveDataset(ds);
          setCustomerId(ds.customer_id);
          setSummary(null);  // any prior summary belongs to a stale run
          try {
            await api(`/reset/${ds.customer_id}`, { method: "POST" });
          } catch (_) { /* best-effort cold-start */ }
          setTrainStatsByCust(prev => {
            const next = { ...prev };
            delete next[ds.customer_id];
            return next;
          });
          const evt = await doStream({ path: ds.train.path }, true,
            { customer: ds.customer_id, phase: "train" });
          if (evt) {
            setTrainStatsByCust(prev => ({ ...prev, [ds.customer_id]: evt }));
            setSummary({ customer_id: ds.customer_id, train: evt, test: null });
          }
        };

        /* Run TEST file for the active dataset. Builds the test-results card
         * by combining the most recent train stats for the same customer. */
        const runTest = async (ds = activeDataset) => {
          if (busy || !ds) return;
          setActiveDataset(ds);
          setCustomerId(ds.customer_id);
          const evt = await doStream({ path: ds.test.path }, true,
            { customer: ds.customer_id, phase: "test" });
          if (evt) {
            const trainEvt = trainStatsByCust[ds.customer_id];
            if (trainEvt) {
              setSummary({
                customer_id: ds.customer_id,
                train: trainEvt,
                test: evt,
              });
            }
          }
        };

        const processLine = () => {
          if (!singleLine.trim() || busy) return;
          doStream({ lines: [singleLine] }, false);
        };

        const handleSingleKey = e => {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); processLine(); }
        };

        const resetCustomer = async () => {
          if (busy) return;
          setBusy(true); setError(null);
          try {
            await api(`/reset/${customerId}`, { method: "POST" });
            // Drop any stored train stats for this customer too — otherwise a
            // subsequent test would compare against stale state.
            setTrainStatsByCust(prev => {
              const next = { ...prev };
              delete next[customerId];
              return next;
            });
            clearAll();
            setParserSnapshot([]);
          } catch (e) { setError(e.message); }
          finally { setBusy(false); }
        };

        const loadSampleLine = async name => {
          try {
            const data = await api(`/sample/${name}`);
            const lines = (data.content || "").split("\n").filter(l => l.trim());
            if (lines.length) setSingleLine(lines[0]);
          } catch {}
        };

        const stats = runStats || liveStats;
        const isDone = !!runStats;

        const handleDatasetSelect = customer => {
          const ds = datasets.find(item => item.customer_id === customer) || null;
          setActiveDataset(ds);
          setCustomerId(customer);
        };

        return (
          <div className="h-screen flex flex-col">

            {/* ── Top bar ── */}
            <div className="bg-white border-b border-slate-200 px-4 py-2 flex items-center gap-3 flex-shrink-0 flex-wrap">
              <span className="font-bold text-sm text-slate-700 mr-1">Event Parser</span>

              {/* Mode switcher */}
              <div className="flex rounded border border-slate-200 text-xs overflow-hidden">
                {[["dataset", "Datasets"], ["single", "Single Line"]].map(([val, label]) => (
                  <button
                    key={val}
                    onClick={() => switchMode(val)}
                    className={`px-3 py-1.5 font-medium transition-colors border-l first:border-l-0 border-slate-200
                      ${mode === val ? "bg-indigo-600 text-white" : "bg-white text-slate-600 hover:bg-slate-50"}`}
                  >
                    {label}
                  </button>
                ))}
              </div>

              <div className="w-px h-5 bg-slate-200"/>

              <label className="flex items-center gap-1.5 text-xs text-slate-500">
                Customer
                <input
                  value={customerId}
                  onChange={e => setCustomerId(e.target.value)}
                  className="mono border border-slate-200 rounded px-2 py-1 text-xs w-28 text-slate-800"
                  placeholder="customer_id"
                />
              </label>

              {mode === "dataset" && (
                <>
                  <label className="flex items-center gap-1.5 text-xs text-slate-500">
                    Dataset
                    <select
                      value={activeDataset?.customer_id || ""}
                      onChange={e => handleDatasetSelect(e.target.value)}
                      className="border border-slate-200 rounded px-2 py-1 text-xs text-slate-800 bg-white max-w-[320px]"
                    >
                      {datasets.map(ds => (
                        <option key={ds.customer_id} value={ds.customer_id}>
                          {ds.customer_id} · {ds.family} v{ds.variant}
                        </option>
                      ))}
                    </select>
                  </label>
                  {activeDataset && (
                    <span className="text-[11px] text-slate-400 mono">
                      train {activeDataset.train.line_count}L · test {activeDataset.test.line_count}L
                    </span>
                  )}
                </>
              )}

              {phaseLabel && (
                <span className={`text-[10px] font-semibold uppercase tracking-widest px-2 py-0.5 rounded ${
                  phaseLabel === "train" ? "bg-amber-100 text-amber-700" : "bg-emerald-100 text-emerald-700"
                }`}>
                  {phaseLabel}
                </span>
              )}

              <div className="flex gap-1.5 ml-auto">
                {mode === "dataset" && activeDataset && (
                  <>
                    <button
                      onClick={() => setPreviewModal({ tone: "train", ds: activeDataset })}
                      disabled={busy}
                      className="border border-amber-200 bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs font-semibold rounded px-2.5 py-1.5 disabled:opacity-50 transition-colors"
                    >
                      View Train Log
                    </button>
                    <button
                      onClick={() => setPreviewModal({ tone: "test", ds: activeDataset })}
                      disabled={busy}
                      className="border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold rounded px-2.5 py-1.5 disabled:opacity-50 transition-colors"
                    >
                      View Test Log
                    </button>
                    <button
                      onClick={() => runTrain(activeDataset)}
                      disabled={busy}
                      className="bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold rounded px-2.5 py-1.5 disabled:opacity-50 transition-colors"
                    >
                      Run Train
                    </button>
                    <button
                      onClick={() => runTest(activeDataset)}
                      disabled={busy || !trainStatsByCust[activeDataset.customer_id]}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded px-2.5 py-1.5 disabled:opacity-30 transition-colors"
                    >
                      Run Test
                    </button>
                  </>
                )}
                {feed.length > 0 && !busy && (
                  <button
                    onClick={clearAll}
                    className="border border-slate-200 hover:bg-slate-50 text-slate-500 text-xs rounded px-2.5 py-1.5 transition-colors"
                  >
                    Clear feed
                  </button>
                )}
                <button
                  onClick={resetCustomer}
                  disabled={busy}
                  className="border border-slate-300 hover:bg-slate-50 text-slate-600 text-xs rounded px-2.5 py-1.5 disabled:opacity-50 transition-colors"
                >
                  Reset state
                </button>
              </div>
            </div>

            {/* ── Dataset helper ── */}
            {mode === "dataset" && (
              <div className="bg-white border-b border-slate-200 px-4 py-2.5 flex-shrink-0 text-xs text-slate-500">
                Select a dataset from the top bar, then run <strong className="text-slate-700">Train</strong> to mint parsers and <strong className="text-slate-700">Test</strong> to see how much work shifts off the LLM.
              </div>
            )}

            {/* ── Single line panel ── */}
            {mode === "single" && (
              <div className="bg-white border-b border-slate-200 px-4 py-3 flex-shrink-0">
                <div className="text-xs text-slate-500 mb-1.5">
                  Paste a log line and press{" "}
                  <kbd className="bg-slate-100 border border-slate-300 rounded px-1 py-0.5 mono text-[10px]">Enter</kbd>
                  {" "}to process one at a time · Shift+Enter for newline
                </div>
                <div className="flex gap-2 max-w-5xl">
                  <textarea
                    value={singleLine}
                    onChange={e => setSingleLine(e.target.value)}
                    onKeyDown={handleSingleKey}
                    rows={2}
                    spellCheck={false}
                    className="mono flex-1 border border-slate-300 rounded px-2.5 py-2 text-xs resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent placeholder-slate-300 text-slate-700 leading-relaxed"
                    placeholder="2025-01-15T10:23:45Z INFO action=click user=u123 product=prod_456 session=s_abc"
                  />
                  <button
                    onClick={processLine}
                    disabled={busy || !singleLine.trim()}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded px-4 py-2 disabled:opacity-50 transition-colors self-start"
                  >
                    {busy ? "…" : "Process"}
                  </button>
                </div>
                {samples.length > 0 && (
                  <div className="mt-2 flex items-center gap-2 text-[11px] text-slate-400">
                    <span>Load example from:</span>
                    {samples.map(s => (
                      <button
                        key={s.name}
                        onClick={() => loadSampleLine(s.name)}
                        className="underline hover:text-indigo-500 transition-colors"
                      >
                        {s.name}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            )}

            {error && (
              <div className="bg-rose-50 border-b border-rose-200 text-rose-700 px-4 py-2 text-xs flex-shrink-0">
                {error}
              </div>
            )}

            {/* ── Stats bar ── */}
            <StatsBar stats={stats} busy={busy} isDone={isDone} />

            {/* Summary callout — sits above the feed and does not scroll with it. */}
            {(feed.length > 0 || parserSnapshot.length > 0 || summary) && (
              <LearningSummary
                stats={stats}
                feed={feed}
                parsers={parserSnapshot}
                customerId={customerId}
                phaseLabel={phaseLabel}
                eventCatalog={eventCatalog}
                onOpenHistory={setHistoryModal}
              />
            )}

            {summary && (
              <div className="bg-slate-100 px-3 pt-3 flex-shrink-0">
                <SummaryCard result={summary} />
              </div>
            )}

            {/* ── Feed ── */}
            <div
              ref={feedRef}
              onScroll={handleScroll}
              className={`flex-1 overflow-auto bg-slate-100 px-3 pb-3${summary ? "" : " pt-3"}`}
            >
              {feed.length === 0 && !busy && !summary && (
                <div className="text-center text-slate-400 text-sm mt-24">
                  {mode === "dataset"
                    ? <>Pick a dataset from the top bar and click <strong className="text-amber-600">Run Train</strong>, then <strong className="text-emerald-600">Run Test</strong></>
                    : <>Paste a log line above and press <strong className="text-slate-600">Enter</strong></>}
                </div>
              )}

              {feed.map((entry, idx) => (
                <FeedEntry
                  key={entry._key}
                  entry={entry}
                  displayN={idx + 1}
                  isNew={entry._key === newestKey}
                />
              ))}

              {busy && (
                <div className="mono text-xs text-slate-400 flex items-center gap-2 px-3 py-2">
                  <span className="animate-pulse inline-block w-1.5 h-1.5 rounded-full bg-slate-400"/>
                  processing…
                </div>
              )}
            </div>

            <div className="bg-white border-t border-slate-200 px-4 py-1.5 flex flex-wrap items-center gap-4 text-[11px] text-slate-500 flex-shrink-0">
              {[
                ["bg-indigo-500",  "LLM — new extraction"],
                ["bg-emerald-500", "parser / shadow — observing"],
                ["bg-amber-400",   "parser / canary — learning"],
                ["bg-emerald-300", "parser / active — validated"],
                ["bg-rose-500",    "quarantine"],
              ].map(([color, label]) => (
                <span key={label} className="inline-flex items-center gap-1.5">
                  <span className={`inline-block w-2 h-2 rounded-sm ${color}`}/>
                  {label}
                </span>
              ))}
            </div>

            <ExpressionHistoryModal
              open={!!historyModal}
              onClose={() => setHistoryModal(null)}
              details={historyModal}
            />

            <SamplesModal
              open={!!previewModal}
              onClose={() => setPreviewModal(null)}
              tone={previewModal?.tone}
              title={previewModal ? `${previewModal.ds.customer_id} · ${previewModal.tone}` : ""}
              sampleName={previewModal ? previewModal.ds[previewModal.tone].name : null}
              totalLines={previewModal ? previewModal.ds[previewModal.tone].line_count : 0}
            />

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
